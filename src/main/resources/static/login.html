<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>RecervHotel - Iniciar sesión</title>
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-12 col-md-9">
        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-0">
            <div class="row">
              <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
              <div class="col-lg-6">
                <div class="p-5">
                  <div class="text-center">
                    <h1 class="h4 text-gray-900 mb-2">RecervHotel</h1>
                    <p class="mb-4">Panel de administración</p>
                  </div>
                  <div id="login-error" class="alert alert-danger d-none"></div>
                  <form id="login-form" class="user">
                    <div class="form-group">
                      <input type="email" class="form-control form-control-user" id="login-email"
                        placeholder="Correo electrónico" required>
                    </div>
                    <div class="form-group">
                      <input type="password" class="form-control form-control-user" id="login-password"
                        placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-user btn-block">
                      Iniciar sesión
                    </button>
                  </form>
                  <hr>
                  <div class="text-center">
                    <a class="small" href="register.html">¿No tienes cuenta? Regístrate</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/sb-admin-2.min.js"></script>
  <script src="js/hotel-api.js"></script>
  <script src="js/hotel-auth.js"></script>
  <script>
    $('#login-form').on('submit', async function (e) {
      e.preventDefault();
      var errorEl = $('#login-error');
      errorEl.addClass('d-none');
      var email = $('#login-email').val().trim();
      var password = $('#login-password').val();

      try {
        var res = await api.login({ email: email, password: password });
        var userData = { id: res.id, nombre: res.nombre, email: res.email, telefono: res.telefono, rol: res.rol };
        setLoggedUser(userData, res.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.text(err.message || 'Credenciales inválidas').removeClass('d-none');
      }
    });
  </script>
</body>
</html>
