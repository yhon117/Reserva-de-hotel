<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Recerva Hotel - Registro</title>
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">
  <div class="container">
    <div class="card o-hidden border-0 shadow-lg my-5">
      <div class="card-body p-0">
        <div class="row">
          <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
          <div class="col-lg-7">
            <div class="p-5">
              <div class="text-center">
                <h1 class="h4 text-gray-900 mb-4">Crear una cuenta</h1>
              </div>
              <div id="register-error" class="alert alert-danger d-none"></div>
              <div id="register-success" class="alert alert-success d-none"></div>
              <form id="register-form" class="user">
                <div class="form-group row">
                  <div class="col-sm-12">
                    <input type="text" class="form-control form-control-user" id="reg-nombre"
                      placeholder="Nombre completo" required>
                  </div>
                </div>
                <div class="form-group">
                  <input type="email" class="form-control form-control-user" id="reg-email"
                    placeholder="Correo electrónico" required>
                </div>
                <div class="form-group row">
                  <div class="col-sm-6 mb-3 mb-sm-0">
                    <input type="password" class="form-control form-control-user" id="reg-password"
                      placeholder="Contraseña" required>
                  </div>
                  <div class="col-sm-6">
                    <input type="password" class="form-control form-control-user" id="reg-password2"
                      placeholder="Repetir contraseña" required>
                  </div>
                </div>
                <div class="form-group">
                  <input type="text" class="form-control form-control-user" id="reg-telefono"
                    placeholder="Teléfono (opcional)">
                </div>
                <button type="submit" class="btn btn-primary btn-user btn-block">
                  Crear cuenta
                </button>
              </form>
              <hr>
              <div class="text-center">
                <a class="small" href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/sb-admin-2.min.js"></script>
  <script src="js/hotel-api.js"></script>
  <script src="js/hotel-auth.js"></script>
  <script>
    $('#register-form').on('submit', async function (e) {
      e.preventDefault();
      var errorEl = $('#register-error');
      var successEl = $('#register-success');
      errorEl.addClass('d-none');
      successEl.addClass('d-none');

      var nombre = $('#reg-nombre').val().trim();
      var email = $('#reg-email').val().trim();
      var password = $('#reg-password').val();
      var password2 = $('#reg-password2').val();
      var telefono = $('#reg-telefono').val().trim();

      if (password !== password2) {
        errorEl.text('Las contraseñas no coinciden').removeClass('d-none');
        return;
      }

      try {
        await api.registro({ nombre: nombre, email: email, password: password, telefono: telefono || undefined });
        successEl.text('Cuenta creada correctamente. Redirigiendo al login...').removeClass('d-none');
        setTimeout(function () { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        errorEl.text(err.message || 'Error al registrar').removeClass('d-none');
      }
    });
  </script>
</body>
</html>
